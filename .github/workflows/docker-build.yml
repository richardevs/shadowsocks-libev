name: Build Custom Edge Image

on:
  push:
    branches:
      - "custom-edge"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push image to GHCR)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64
          push: true
          load: false
          tags: |
            ghcr.io/${{ github.repository }}:custom-edge
            ghcr.io/${{ github.repository }}:${{ github.sha }}


      # Image is pushed to GitHub Container Registry (GHCR) under the tags configured in the build step.
      # No image tar artifact is saved by default to avoid redundant storage.
